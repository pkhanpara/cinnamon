name: Publish image

# Builds the Docker image (linux/amd64) and publishes it to ghcr.io/pkhanpara/cinnamon (ADR 0016).
# Pull requests build and smoke-test the image without pushing. main is published nightly, not per merge.
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC, on the default branch
  push:
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/pkhanpara/cinnamon

jobs:
  # Nightly runs are skipped when main has no commit from the last 25 hours; every other trigger builds.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: gate
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "schedule" ] && \
             [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 90000 ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No commit on main in the last 25h; skipping nightly."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=schedule,pattern=nightly
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Cinnamon
            org.opencontainers.image.description=Self-hosted, multi-user portfolio tracker

      # Build once into the local daemon so the smoke test runs on the exact image that gets pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cinnamon:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -eu
          docker run -d --name cinnamon-ci -p 8000:8000 cinnamon:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/api/health
          curl -fsS http://localhost:8000/ | grep -qi '<app-root'
          # Nothing private may end up in the image (.env, seed data, local databases).
          leaks=$(docker run --rm --entrypoint sh cinnamon:ci -c \
            'find /app \( -name ".env*" -o -name seed -o -name "*.db" -o -name "*.sqlite3" \) -print')
          if [ -n "$leaks" ]; then echo "Unexpected files in image: $leaks"; exit 1; fi

      - name: Container logs
        if: always()
        run: docker logs cinnamon-ci || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as Build, so every layer comes from the cache; this adds provenance and SBOM.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
